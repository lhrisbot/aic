# GitHub Pages 部署（自动构建）

> 这是自动部署工作流的**参考副本**。它没有放在 `.github/workflows/` 下，
> 因为用 OAuth 令牌推送 `.github/workflows/**` 需要 `workflow` 权限，
> 而当前 gh 令牌只有 `gist / read:org / repo`（推送会被 GitHub 拒绝）。
>
> 启用方式见 `docs/05-deploy-github-pages.md` §6.2：
> 网页端粘贴到 `.github/workflows/deploy-pages.yml`，或给 gh 补授权后推送。
>
> 当前线上站点用的是「从 gh-pages 分支部署」，不依赖本工作流。

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 构建（自动带上仓库名前缀、404 回退与 .nojekyll）
        working-directory: web
        env:
          # 项目站点地址是 https://<用户名>.github.io/<仓库名>/，因此资源前缀取仓库名
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
